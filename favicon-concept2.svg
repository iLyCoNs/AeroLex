<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="50%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="blueCobalt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Squircle Base with Precision Hairline -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg2)" stroke="#24262b" stroke-width="4"/>
  <rect x="32" y="32" width="448" height="448" rx="106" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.08"/>

  <!-- Centered Monogram Group -->
  <g filter="url(#glow2)">
    <!-- LegalTech Precision Diamond Crest -->
    <polygon points="256,104 266,118 256,132 246,118" fill="url(#blueCobalt2)"/>

    <!-- Letter 'A' -->
    <!-- Left Thin Diagonal -->
    <polygon points="214,166 148,348 136,360 114,360 114,352 130,352 196,166" fill="#fcfcfc"/>
    <!-- Left Foot Serif -->
    <path d="M 112 352 L 160 352 L 160 360 L 112 360 Z" fill="#fcfcfc"/>
    <!-- Right Thick Diagonal -->
    <polygon points="216,148 244,148 296,346 312,352 312,360 264,360 264,352 280,348 234,166" fill="#fcfcfc"/>
    <!-- Top Apex Serif of A -->
    <path d="M 200 148 L 244 148 L 230 172 L 194 172 Z" fill="#fcfcfc"/>
    
    <!-- Crossbar: AeroLex Electric Cobalt Horizon Bar -->
    <rect x="156" y="270" width="112" height="10" rx="3" fill="url(#blueCobalt2)"/>

    <!-- Letter 'L' -->
    <!-- Top Head Serif of L -->
    <path d="M 292 148 L 348 148 L 348 156 L 334 156 L 334 168 L 306 168 L 306 156 L 292 156 Z" fill="#fcfcfc"/>
    <!-- Vertical Main Stem -->
    <rect x="306" y="156" width="28" height="192" fill="#fcfcfc"/>
    <!-- Bottom Base Arm of L -->
    <path d="M 306 332 L 388 332 C 402 332 410 338 412 348 L 412 360 L 292 360 L 292 352 L 306 348 Z" fill="#fcfcfc"/>
  </g>
</svg>