name: Vigilancia Judicial 24/7 AeroLex (OJV y Estados Diarios)

on:
  schedule:
    # Pases de prueba inmediatos programados para hoy (05:36, 05:38, 05:40, 05:45 AM Chile / 08:36, 08:38, 08:40, 08:45 UTC)
    - cron: '36 8 * * *'
    - cron: '38 8 * * *'
    - cron: '40 8 * * *'
    - cron: '45 8 * * *'
    # 1. Primer barrido matutino oficial (07:45 AM Chile Continental / 10:45 UTC)
    - cron: '45 10 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '15 12 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '30 21 * * 5'
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: 'Forzar envío de correo de prueba para verificar funcionamiento inmediato'
        required: false
        type: boolean
        default: true

jobs:
  vigilancia-autonoma:
    name: Escaneo Forense OJV y Despacho de Alertas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Python 3 (para despacho SMTP)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar Vigilancia Nube 24/7 (PC Apagado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AEROLEX_NOTIFY_EMAIL: ${{ secrets.AEROLEX_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          AEROLEX_SMTP_USER: ${{ secrets.GMAIL_USER }}
          AEROLEX_SMTP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          if [ "${{ github.event.inputs.modo_prueba }}" = "false" ]; then
            node scripts/vigia-nube-cron.mjs
          else
            node scripts/vigia-nube-cron.mjs --test
          fi
