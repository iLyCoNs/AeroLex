name: Vigilancia Judicial 24/7 AeroLex (OJV y Estados Diarios)

on:
  schedule:
    # 1. Primer barrido matutino oficial (07:45 AM Chile Continental / 10:45 UTC Lun-Vie)
    - cron: '45 10 * * 1-5'
    # 2. Hora crítica de Estados Diarios y Anuncio de Alegatos (08:30 AM Chile Continental / 11:30 UTC Lun-Vie)
    - cron: '30 11 * * 1-5'
    # 3. Barrido de confirmación y rezagos (09:15 AM Chile Continental / 12:15 UTC Lun-Vie)
    - cron: '15 12 * * 1-5'
    # 4. Barrido de mediodía y decretos de jornada (13:30 PM Chile Continental / 16:30 UTC Lun-Vie)
    - cron: '30 16 * * 1-5'
    # 5. Viernes por la tarde - Publicación de Tablas Semanales de Corte (18:30 PM Chile Continental / 21:30 UTC Vie)
    - cron: '30 21 * * 5'
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: 'Forzar envío de correo de prueba (auditoría completa aunque no existan novedades)'
        required: false
        type: boolean
        default: false
      digest_now:
        description: 'Enviar ahora el parte diario de prueba (sin marcar el envío oficial del día)'
        required: false
        type: boolean
        default: false
      pase_utc:
        description: 'Instante UTC del pase disparado por el Worker (ISO 8601). Vacío en respaldos de GitHub.'
        required: false
        type: string
        default: ''

jobs:
  vigilancia-autonoma:
    name: Escaneo Forense OJV y Despacho de Alertas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Python 3 (para despacho SMTP)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar Vigilancia Nube 24/7 (PC Apagado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AEROLEX_NOTIFY_EMAIL: ${{ secrets.AEROLEX_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          AEROLEX_SMTP_USER: ${{ secrets.GMAIL_USER }}
          AEROLEX_SMTP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          PASE_UTC: ${{ github.event.inputs.pase_utc }}
        run: |
          if [ "${{ github.event.inputs.modo_prueba }}" = "true" ]; then
            node scripts/vigia-nube-cron.mjs --test
          elif [ "${{ github.event.inputs.digest_now }}" = "true" ]; then
            node scripts/vigia-nube-cron.mjs --digest-now
          else
            node scripts/vigia-nube-cron.mjs
          fi
