<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="55%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="goldAccent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg1)" stroke="url(#goldGrad1)" stroke-width="5" stroke-opacity="0.45"/>
  <rect x="32" y="32" width="448" height="448" rx="106" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Monogram Group Centered (Width ~290px, Height ~240px, centered around 256, 256) -->
  <g filter="url(#glow1)">
    <!-- Balance scale crest motif -->
    <circle cx="256" cy="115" r="7.5" fill="url(#goldGrad1)"/>
    <path d="M 236 127 L 276 127 L 276 130.5 L 236 130.5 Z" fill="url(#goldGrad1)"/>

    <!-- Letter 'A' -->
    <!-- Apex Head -->
    <path d="M 200 148 L 236 148 L 222 174 L 194 174 Z" fill="url(#goldGrad1)"/>
    <!-- Left Thin Diagonal -->
    <polygon points="214,166 148,348 136,360 114,360 114,352 130,352 196,166" fill="url(#goldGrad1)"/>
    <!-- Left Foot Serif -->
    <path d="M 112 352 L 160 352 L 160 360 L 112 360 Z" fill="url(#goldGrad1)"/>
    <!-- Right Thick Diagonal -->
    <polygon points="216,148 244,148 296,346 312,352 312,360 264,360 264,352 280,348 234,166" fill="url(#goldGrad1)"/>
    <!-- Crossbar -->
    <rect x="156" y="272" width="108" height="8" rx="2" fill="url(#goldAccent1)"/>

    <!-- Letter 'L' interlaced -->
    <!-- Top Serif of L -->
    <path d="M 292 148 L 348 148 L 348 156 L 334 156 L 334 168 L 306 168 L 306 156 L 292 156 Z" fill="url(#goldGrad1)"/>
    <!-- Vertical Main Stem -->
    <rect x="306" y="156" width="28" height="192" fill="url(#goldGrad1)"/>
    <!-- Bottom Base Arm of L -->
    <path d="M 306 332 L 388 332 C 402 332 410 338 412 348 L 412 360 L 292 360 L 292 352 L 306 348 Z" fill="url(#goldGrad1)"/>
  </g>
</svg>