<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="blueBg3" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Blue Gradient -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#blueBg3)" stroke="url(#borderGrad3)" stroke-width="5"/>
  <rect x="32" y="32" width="448" height="448" rx="106" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Centered Pure White Monogram Group -->
  <g filter="url(#glow3)">
    <!-- Scale crest indicator -->
    <circle cx="256" cy="115" r="7" fill="#ffffff"/>
    <path d="M 236 127 L 276 127 L 276 130.5 L 236 130.5 Z" fill="#93c5fd"/>

    <!-- Letter 'A' -->
    <!-- Apex Head -->
    <path d="M 200 148 L 236 148 L 222 174 L 194 174 Z" fill="#ffffff"/>
    <!-- Left Thin Diagonal -->
    <polygon points="214,166 148,348 136,360 114,360 114,352 130,352 196,166" fill="#ffffff"/>
    <!-- Left Foot Serif -->
    <path d="M 112 352 L 160 352 L 160 360 L 112 360 Z" fill="#ffffff"/>
    <!-- Right Thick Diagonal -->
    <polygon points="216,148 244,148 296,346 312,352 312,360 264,360 264,352 280,348 234,166" fill="#ffffff"/>
    <!-- Crossbar -->
    <rect x="156" y="272" width="108" height="8" rx="2" fill="#93c5fd"/>

    <!-- Letter 'L' -->
    <!-- Top Head Serif of L -->
    <path d="M 292 148 L 348 148 L 348 156 L 334 156 L 334 168 L 306 168 L 306 156 L 292 156 Z" fill="#ffffff"/>
    <!-- Vertical Main Stem -->
    <rect x="306" y="156" width="28" height="192" fill="#ffffff"/>
